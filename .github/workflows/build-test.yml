name: Build & test

# Reusable workflow: downloads the current official .deb, builds the AppImage,
# runs the smoke tests and uploads the result as the "appimage" artifact.
on:
  workflow_call:
    outputs:
      app_version:
        description: Real application version (e.g. 2.0.0.5)
        value: ${{ jobs.build.outputs.app_version }}
      deb_version:
        description: Version field of the .deb
        value: ${{ jobs.build.outputs.deb_version }}
      deb_filename:
        description: File name of the .deb
        value: ${{ jobs.build.outputs.deb_filename }}
      deb_sha256:
        description: SHA256 of the .deb the AppImage was built from
        value: ${{ jobs.build.outputs.deb_sha256 }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      app_version: ${{ steps.build.outputs.app_version }}
      deb_version: ${{ steps.build.outputs.deb_version }}
      deb_filename: ${{ steps.build.outputs.deb_filename }}
      deb_sha256: ${{ steps.build.outputs.deb_sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils file zsync

      - name: Build AppImage
        id: build
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: scripts/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          # Libraries the AppImage expects from the host (see README "Requirements").
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libgtk-3-0t64 libsoup2.4-1 libglu1-mesa libegl1 libgl1-mesa-dri \
            libdbus-1-3 zlib1g gstreamer1.0-libav gstreamer1.0-plugins-good \
            xvfb xauth desktop-file-utils appstream

      - uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist

      - name: Smoke test
        env:
          LAUNCH_TEST: "1"
          LAUNCH_SECONDS: "60"
          LOG_DIR: test-logs
        run: |
          chmod +x dist/*.AppImage
          scripts/test-appimage.sh dist/*.AppImage

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test-logs/
          if-no-files-found: ignore
          retention-days: 7
