name: Check for updates & release

on:
  schedule:
    # Every 6 hours. Cheap when nothing changed: only the apt index is fetched.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-publish even if this upstream .deb was already released
        type: boolean
        default: false

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # keep the scheduled workflow from being auto-disabled
    outputs:
      new: ${{ steps.released.outputs.new }}
      hint_version: ${{ steps.upstream.outputs.hint_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Query Anycubic apt repository
        id: upstream
        run: scripts/check-upstream.sh

      - name: Compare with published releases
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.deb_sha256 }}
          FORCE: ${{ inputs.force || false }}
          HINT_VERSION: ${{ steps.upstream.outputs.hint_version }}
          DEB_VERSION: ${{ steps.upstream.outputs.deb_version }}
          DEB_FILENAME: ${{ steps.upstream.outputs.deb_filename }}
        run: |
          if gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].body' | grep -qF "deb-sha256: $SHA"; then
            echo "Upstream .deb $SHA is already released."
            new=false
          else
            echo "Upstream .deb $SHA has not been released yet."
            new=true
          fi
          if [ "$FORCE" = "true" ]; then
            echo "Forced rebuild requested."
            new=true
          fi
          echo "new=$new" >>"$GITHUB_OUTPUT"
          {
            echo "### Upstream"
            echo "| | |"
            echo "|---|---|"
            echo "| Version (from file name) | $HINT_VERSION |"
            echo "| deb version | $DEB_VERSION |"
            echo "| deb file | $DEB_FILENAME |"
            echo "| deb SHA256 | \`$SHA\` |"
            echo "| Build needed | **$new** |"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep scheduled workflow enabled
        # GitHub disables cron workflows after 60 days without repository activity.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable" || true

  build-test:
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/build-test.yml

  publish:
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build-test.outputs.app_version }}
          DEB_VERSION: ${{ needs.build-test.outputs.deb_version }}
          DEB_FILENAME: ${{ needs.build-test.outputs.deb_filename }}
          DEB_SHA256: ${{ needs.build-test.outputs.deb_sha256 }}
        run: |
          set -euo pipefail
          test -n "$APP_VERSION" && test -n "$DEB_SHA256"
          tag="v$APP_VERSION"
          chmod +x dist/*.AppImage
          appimage="$(basename dist/*.AppImage)"

          cat >notes.md <<EOF
          Anycubic Slicer Next **$APP_VERSION** as AppImage, built automatically from the official Anycubic Ubuntu 24.04 package.

          ### Install
          \`\`\`bash
          chmod +x $appimage
          ./$appimage
          \`\`\`
          Requires glibc ≥ 2.38 and WebKit2GTK 4.1 on the host. See the [README](https://github.com/$GH_REPO#requirements) for requirements and troubleshooting.
          Supports in-place updates with [Gear Lever](https://flathub.org/apps/it.mijorus.gearlever) / AppImageUpdate.

          ### Verify
          \`\`\`bash
          sha256sum -c $appimage.sha256
          \`\`\`

          ### Upstream package
          - deb file: \`$DEB_FILENAME\`
          - deb version: \`$DEB_VERSION\`
          - deb-sha256: $DEB_SHA256

          _Unofficial build, not affiliated with Anycubic._
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists, replacing assets and notes"
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md --title "Anycubic Slicer Next $APP_VERSION" --latest
          else
            gh release create "$tag" dist/* \
              --title "Anycubic Slicer Next $APP_VERSION" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
          echo "Published [$tag](https://github.com/$GH_REPO/releases/tag/$tag)" >>"$GITHUB_STEP_SUMMARY"
